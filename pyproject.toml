[project]
name = "sabtiah-captions"
version = "0.1.0"
description = "Live Arabic/English captions for the Sabtiah AI meetup in Riyadh"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "sounddevice>=0.5",
    "numpy>=2.1",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
