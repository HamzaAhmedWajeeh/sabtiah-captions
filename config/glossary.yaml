# Shared across sessions. Fed into the Soniox `context` object on every connection.
#
# `terms` biases *recognition*: it helps the model hear the word at all.
# `translation_terms` controls what happens to the word when it crosses into
# the other language. A term that is not in `terms` cannot be preserved by
# `translation_terms`, because it was never recognised in the first place -
# `transformers` was missing from both on run6 (2026-10-13) and came back as
# المحوّلات.
#
# Mapping a term to itself is how a word is kept in English inside the Arabic
# captions, and run7 (2026-10-13) proved it works: `transformers` came back as
# المحوّلات on run6 when it was in neither list, and as `transformers` on run7
# with nothing else changed.
#
# Two words did not obey it on run7, and both are ordinary English with a
# settled Arabic equivalent: `agents` became أجهزة ("devices") and `AI` became
# الذكاء الاصطناعي. `AI` is deliberately no longer in `translation_terms` -
# الذكاء الاصطناعي is the natural Arabic and the audience reads it more easily
# than the acronym. It stays in `terms` so it is still recognised.
# `agents` is left in to be retested; see docs/soniox-notes.md.
#
# `Sabtiah` is the other deliberate exception: a name the audience reads in
# Arabic.
terms:
  - RAG
  - MCP
  - LLM
  - LLMs
  - fine-tuning
  - agent
  - agents
  - agentic
  - embeddings
  - vector database
  - transformers
  - transformer
  - ChatGPT
  - AI
  - Sabtiah
  - Cycls

translation_terms:
  # Keep the English word in the Arabic captions.
  - {source: transformers, target: transformers}
  - {source: transformer, target: transformer}
  - {source: LLM, target: LLM}
  - {source: LLMs, target: LLMs}
  - {source: RAG, target: RAG}
  - {source: MCP, target: MCP}
  - {source: agent, target: agent}
  - {source: agents, target: agents}
  - {source: fine-tuning, target: fine-tuning}
  - {source: embeddings, target: embeddings}
  - {source: ChatGPT, target: ChatGPT}
  # Not English: the meetup's own name is read in Arabic.
  - {source: Sabtiah, target: السبتية}
